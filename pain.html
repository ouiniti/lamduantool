<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ประเมินความปวด รพ.ลำดวน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f0; --card:#ffffff; --ink:#16302b; --muted:#5a6f69; --line:#d3ddd9;
  --acc:#1f7a5c; --acc-ink:#ffffff; --acc-soft:#dcefe6;
  --s0:#ffffff; --s1:#e2f3e9; --s2:#fdf0cf; --s3:#fbdcd6;
  --warn:#8a5300; --warn-soft:#fdf0cf; --bad:#a3271a; --bad-soft:#fbdcd6; --ok:#1f6b4f; --ok-soft:#dcefe6;
  --shade:rgba(10,25,20,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1715; --card:#18231f; --ink:#e4efea; --muted:#9db3ab; --line:#2b3b35;
    --acc:#46b98a; --acc-ink:#062018; --acc-soft:#1c3a2e;
    --s0:#18231f; --s1:#173527; --s2:#3a3014; --s3:#3f1d18;
    --warn:#f2c46b; --warn-soft:#3a3014; --bad:#f39a8c; --bad-soft:#3f1d18; --ok:#7fd8ae; --ok-soft:#1c3a2e;
    --shade:rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1715; --card:#18231f; --ink:#e4efea; --muted:#9db3ab; --line:#2b3b35;
  --acc:#46b98a; --acc-ink:#062018; --acc-soft:#1c3a2e;
  --s0:#18231f; --s1:#173527; --s2:#3a3014; --s3:#3f1d18;
  --warn:#f2c46b; --warn-soft:#3a3014; --bad:#f39a8c; --bad-soft:#3f1d18; --ok:#7fd8ae; --ok-soft:#1c3a2e;
  --shade:rgba(0,0,0,.7);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans Thai','Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;font-size:19px;line-height:1.5;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
img{max-width:100%}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:var(--acc-ink)}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:62px}
.ib{width:46px;height:46px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:inherit;font-size:1.5rem;line-height:1;flex:none}
.tt{flex:1;min-width:0}
.t1{font-weight:700;font-size:1.1rem;line-height:1.2}
.t2{font-size:.82rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide{flex:none;height:46px;padding:0 14px;border:2px solid rgba(255,255,255,.7);border-radius:12px;background:transparent;color:inherit;font-weight:700;font-size:.95rem}

.wrap{max-width:820px;margin:0 auto;padding:14px 14px 32px}
.q{font-size:1.4rem;line-height:1.35;margin:8px 0 12px;font-weight:700}
.hint{margin:-4px 0 12px;color:var(--muted);font-size:.92rem}
.muted{color:var(--muted)} .sm{font-size:.85rem} .b{font-weight:700}
.foot{color:var(--muted);font-size:.82rem;margin-top:22px}
.lbl{display:block;font-weight:600;margin:16px 0 8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.stack{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.btn{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;background:var(--card);border:2px solid var(--line);border-radius:16px;text-align:left}
.btn .l{display:block;font-weight:600;font-size:1.05rem;line-height:1.3}
.btn .s{display:block;font-size:.85rem;color:var(--muted);line-height:1.35}
.btn .tag{margin-left:auto;flex:none;font-weight:700;font-size:.9rem;color:var(--acc)}
.btn .mid{flex:1;min-width:0}
.btn.col{flex-direction:column;justify-content:center;text-align:center;min-height:104px;gap:4px}
.btn .ic{font-size:1.9rem;line-height:1}
.btn.ghost{border-style:dashed}
.btn.on{border-color:var(--acc);background:var(--acc-soft)}
.sc{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--ok);font-weight:700;font-size:1.3rem}

.primary{display:block;width:100%;min-height:62px;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:1.15rem;margin-top:14px}
.secbtn{display:block;width:100%;min-height:54px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-weight:600;margin-top:12px}
.secbtn.danger{color:var(--bad)}
.link{display:block;margin:16px auto 0;background:none;border:0;color:var(--acc);font-weight:600;text-decoration:underline;min-height:44px}
.inp{width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:0 14px;font:inherit;font-size:1.25rem;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:.95rem}
.chip.on{border-color:var(--acc);background:var(--acc-soft);font-weight:600}

.nrs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.nb{min-height:76px;border:2px solid var(--line);border-radius:14px;font-size:1.9rem;font-weight:700}
.s0{background:var(--s0)} .s1{background:var(--s1)} .s2{background:var(--s2)} .s3{background:var(--s3)}
.ends{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:.9rem}

.facecard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px}
.facecard img{display:block;width:100%;height:auto}
.frow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.fb{min-height:84px;border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.fb .n{font-size:1.7rem;font-weight:700;line-height:1}
.fb .t{font-size:.72rem;line-height:1.2;color:var(--ink);text-align:center;margin-top:4px}
.upload{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.upload p{margin:0 0 10px;font-size:.92rem;color:var(--muted)}
.upbtn{display:inline-block;min-height:48px;padding:10px 18px;border-radius:12px;background:var(--acc-soft);color:var(--ok);font-weight:700;border:0}
.mini{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;min-height:40px}

.prog{display:flex;gap:6px;margin:6px 0}
.prog span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog span.done{background:var(--acc)} .prog span.cur{background:var(--acc);opacity:.45}

.scorecard{text-align:center;padding:16px 14px}
.bignum{font-size:4rem;font-weight:700;line-height:1}
.bignum small{font-size:1.4rem;color:var(--muted);font-weight:600}
.band{font-size:1.15rem;font-weight:600;margin-top:6px}
.banner{border-radius:14px;padding:12px 14px;font-size:.95rem;margin:10px 0;line-height:1.45}
.banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.ok{background:var(--ok-soft);color:var(--ok)}
.grouplbl{font-weight:600;margin:14px 0 8px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec-h h2{font-size:1.1rem;margin:0}
.pcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:74px}
.bedno{font-size:1.5rem;font-weight:700;line-height:1.1;min-width:52px}
.due{font-weight:700;font-size:.95rem;text-align:right}
.due.bad{color:var(--bad)} .due.warn{color:var(--warn)} .due.ok{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:22px 8px;border:2px dashed var(--line);border-radius:16px}
.okbig{font-size:1.4rem;font-weight:700;color:var(--ok);margin:8px 0 12px}
.trow{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.aie{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-family:inherit;font-size:.95rem;line-height:1.6;margin:0;max-height:42vh;overflow:auto}
.hist{list-style:none;margin:0;padding:0}
.hist li{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:.95rem}

/* guide popup */
.modal{position:fixed;inset:0;z-index:30;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:780px;height:calc(100% - env(safe-area-inset-top,0px) - 12px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1.5px solid var(--line)}
.sheet-h h2{flex:1;margin:0;font-size:1.15rem}
.xbtn{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.3rem}
.sheet-b{overflow:auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));font-size:.98rem}
.sheet-b details{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px}
.sheet-b summary{padding:14px;font-weight:700;cursor:pointer;min-height:52px;list-style-position:inside}
.sheet-b .in{padding:0 14px 14px}
.sheet-b h3{font-size:1rem;margin:12px 0 6px}
.sheet-b p,.sheet-b ul,.sheet-b ol{margin:6px 0}
.sheet-b ul,.sheet-b ol{padding-left:22px}
.flow{counter-reset:f;list-style:none;padding:0 !important}
.flow>li{position:relative;padding:10px 12px 10px 52px;border-left:3px solid var(--acc);margin-left:16px;margin-bottom:6px}
.flow>li::before{counter-increment:f;content:counter(f);position:absolute;left:-17px;top:8px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700}
.yes,.no{display:inline-block;font-weight:700;font-size:.85rem;border-radius:6px;padding:0 8px;margin-right:6px}
.yes{background:var(--ok-soft);color:var(--ok)} .no{background:var(--bad-soft);color:var(--bad)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.tbl th{background:var(--acc-soft)}
.key{background:var(--acc-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.key ol{margin:4px 0 0}
.quiz details{background:var(--bg)}
.quiz summary{font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:40}
@media (prefers-reduced-motion:no-preference){button:active{transform:scale(.98)}}
@media (min-width:700px){
  body{font-size:20px}
  .nrs{grid-template-columns:repeat(11,1fr)} .nb{min-height:88px}
  .modal{align-items:center} .sheet{height:88%;border-radius:20px}
}
</style>
</head>
<body>
<a href="index.html" style="display:block;max-width:960px;margin:0 auto;padding:10px 16px;font:500 14px 'Sarabun','IBM Plex Sans Thai',sans-serif;color:#2E6B66;text-decoration:none">&larr; เครื่องมือ รพ.ลำดวน</a>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ===== ค่าที่โรงพยาบาลต้องรับรองก่อนใช้จริง ===== */
const CONFIG = {
  alert: { NRS:4, FACES:4, CPOT:3, BPS:6, FLACC:4, PAINAD:4 },        // คะแนน >= ค่านี้ ขึ้นแถบเตือน
  reassessMin: { IV:30, IM:60, PO:60, NONDRUG:30, MD:30 },            // ประเมินผลบรรเทาปวดซ้ำ (นาที)
  safetyMin: { IV:15, IM:30, PO:60 }                                   // V/S + sedation หลัง strong opioid (ตามเอกสาร)
};
const KEY='lamduan-pain-v2', FACEKEY='lamduan-faces-img';

const SETTINGS=[['ER','ER'],['IPD','IPD/หลังผ่าตัด'],['PROC','หัตถการ'],['ICU','วิกฤต/IMC'],['OPD','OPD'],['PAL','ประคับประคอง']];
const WHO=[
  {id:'NRS',  l:'บอกเป็นตัวเลข 0–10 ได้', s:'ผู้ใหญ่ หรือเด็กโตที่เข้าใจตัวเลข', who:'ผู้ป่วยตอบเอง'},
  {id:'FACES',l:'ชี้รูปใบหน้าได้', s:'เด็ก 3 ปีขึ้นไป หรือไม่เข้าใจตัวเลข', who:'ผู้ป่วยตอบเอง'},
  {id:'CPOT', l:'บอกเองไม่ได้ ผู้ใหญ่วิกฤต', s:'สังเกตพฤติกรรม', who:'พยาบาลสังเกต'},
  {id:'FLACC',l:'บอกเองไม่ได้ เด็กเล็ก', s:'สังเกตพฤติกรรม + ถามผู้ดูแล', who:'พยาบาลสังเกต'},
  {id:'PAINAD',l:'บอกเองไม่ได้ สมองเสื่อมรุนแรง', s:'สังเกตพฤติกรรม', who:'พยาบาลสังเกต'},
  {id:'UNABLE',l:'ประเมินไม่ได้', s:'เช่น ได้ยาหย่อนกล้ามเนื้อ ไม่รู้สึกตัวลึก', who:''}
];
const FACES=[[0,'ไม่เจ็บ'],[2,'เจ็บเล็กน้อย'],[4,'เจ็บพอสมควร'],[6,'เจ็บมากหน่อย'],[8,'เจ็บมาก'],[10,'เจ็บจนทนไม่ได้']];
const I={
  cF:{t:'สีหน้า',o:[[0,'ผ่อนคลาย ปกติ'],[1,'ตึงเครียด','หน้านิ่ว คิ้วขมวด'],[2,'หน้าเบ้','ร่วมกับปิดตาแน่น อาจกัดท่อ']]},
  cB:{t:'การเคลื่อนไหวร่างกาย',o:[[0,'นิ่ง หรือท่าปกติ'],[1,'ปกป้องตัวเอง','ขยับช้า ระวัง จับจุดที่ปวด'],[2,'กระสับกระส่าย','ดึงท่อ พยายามลุก ปัดป่าย']]},
  cM:{t:'กล้ามเนื้อ (ขณะงอ–เหยียดแขนให้)',o:[[0,'ผ่อนคลาย ไม่ต้าน'],[1,'ตึง แข็ง มีการต้าน'],[2,'ตึงมาก ต้านจนขยับไม่ได้']]},
  cV:{t:'การยอมรับเครื่องช่วยหายใจ',o:[[0,'หายใจตามเครื่องได้ดี'],[1,'ไอ แต่ยอมรับได้'],[2,'ต้านเครื่อง','alarm ดังบ่อย']]},
  cS:{t:'การออกเสียง',o:[[0,'พูดปกติ หรือเงียบ'],[1,'ถอนหายใจ ครวญคราง'],[2,'ร้องไห้ ร้องโวยวาย สะอื้น']]},
  bF:{t:'สีหน้า',o:[[1,'ผ่อนคลาย'],[2,'ตึงบางส่วน','คิ้วขมวดลง'],[3,'ตึงเต็มที่','หลับตาแน่น'],[4,'หน้าเบ้']]},
  bL:{t:'แขน',o:[[1,'ไม่เคลื่อนไหว'],[2,'งอแขนบางส่วน'],[3,'งอแขนเต็มที่ + งอนิ้ว'],[4,'เกร็งงอค้างตลอด']]},
  bV:{t:'การยอมรับเครื่องช่วยหายใจ',o:[[1,'หายใจตามเครื่องได้'],[2,'ไอ แต่ส่วนใหญ่ทนได้'],[3,'ต้านเครื่อง'],[4,'ควบคุมการหายใจไม่ได้']]},
  bS:{t:'การออกเสียง',o:[[1,'ไม่มีเสียงแสดงความปวด'],[2,'ครางนาน ๆ ครั้ง','ไม่เกิน 3 ครั้ง/นาที สั้น'],[3,'ครางบ่อยหรือนาน'],[4,'ร้องโหยหวน บ่นว่าเจ็บ','หรือกลั้นหายใจ']]}
};
const FLACC=[
  {t:'ใบหน้า',o:[[0,'ปกติ หรือยิ้ม'],[1,'หน้าเบ้/ขมวดคิ้วบางครั้ง','ซึม ไม่สนใจ'],[2,'คางสั่นบ่อย กัดกราม']]},
  {t:'ขา',o:[[0,'ปกติ ผ่อนคลาย'],[1,'กระสับกระส่าย ตึง'],[2,'เตะ หรืองอขาขึ้น']]},
  {t:'การเคลื่อนไหว',o:[[0,'นอนนิ่ง ขยับง่าย'],[1,'บิดตัว ขยับไปมา'],[2,'แอ่นตัว แข็ง หรือกระตุก']]},
  {t:'การร้อง',o:[[0,'ไม่ร้อง'],[1,'คราง บ่นบางครั้ง'],[2,'ร้องต่อเนื่อง กรีดร้อง สะอื้น']]},
  {t:'การปลอบ',o:[[0,'สงบ ผ่อนคลาย'],[1,'สงบได้เมื่อกอด สัมผัส พูดด้วย'],[2,'ปลอบยาก']]}
];
const PAINAD=[
  {t:'การหายใจ',o:[[0,'ปกติ'],[1,'หายใจลำบากบางครั้ง'],[2,'หายใจดัง ลำบาก หรือเร็วนาน']]},
  {t:'การออกเสียง',o:[[0,'ไม่มี'],[1,'ครางบางครั้ง'],[2,'ร้องเรียกซ้ำ ครางดัง ร้องไห้']]},
  {t:'สีหน้า',o:[[0,'ยิ้ม หรือเฉย ๆ'],[1,'เศร้า กลัว ขมวดคิ้ว'],[2,'หน้าเบ้']]},
  {t:'ภาษากาย',o:[[0,'ผ่อนคลาย'],[1,'ตึง กระสับกระส่าย เดินไปมา'],[2,'เกร็ง กำมือ ผลักออก หรือตี']]},
  {t:'การปลอบ',o:[[0,'ไม่ต้องปลอบ'],[1,'สงบได้ด้วยเสียง/สัมผัส'],[2,'ปลอบไม่ได้']]}
];
const TOOLS={
  NRS:{name:'NRS',max:10}, FACES:{name:'Faces scale',max:10},
  CPOT:{name:'CPOT',max:8,obs:1,intub:1,items:t=>[I.cF,I.cB,I.cM,t?I.cV:I.cS]},
  BPS:{name:'BPS',max:12,obs:1,intub:1,items:t=>[I.bF,I.bL,t?I.bV:I.bS]},
  FLACC:{name:'FLACC',max:10,obs:1,items:()=>FLACC},

function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.patients))return o;}catch(e){}return{patients:[]};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(ms){const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function getP(id){return DB.patients.find(p=>p.id===id);}
function setLabel(id){const s=SETTINGS.find(x=>x[0]===id);return s?s[1]:'';}
function tName(d){return d.tool==='BPS'&&d.intubated===false?'BPS-NI':TOOLS[d.tool].name;}
function items(d){return TOOLS[d.tool].items(d.intubated);}
function openTasks(p){return p.tasks.filter(t=>!t.done).sort((a,b)=>a.due-b.due);}
function nextDue(p){const t=openTasks(p)[0];return t?t.due:9e15;}
function lastScored(p){for(let i=p.entries.length-1;i>=0;i--)if(p.entries[i].kind!=='safety')return p.entries[i];return null;}
function short(e){return e.unable?'ประเมินไม่ได้':`${e.toolName} ${e.score}/${e.max}`;}
function cls(n){return n===0?'s0':n<=3?'s1':n<=6?'s2':'s3';}
function band(n){return n===0?'ไม่ปวดเลย':n<=3?'ปวดน้อย':n<=6?'ปวดปานกลาง':n<=9?'ปวดมาก':'ปวดมากที่สุด';}
function dueText(due){const m=Math.round((due-Date.now())/60000);
  if(m<0)return{txt:`เกิน ${-m} นาที`,c:'bad'}; if(m<=10)return{txt:`อีก ${m} นาที`,c:'warn'}; return{txt:`${fmt(due)} น.`,c:'ok'};}
function draft(x){return Object.assign({pid:null,kind:'initial',bed:'',setting:null,tool:null,who:'',intubated:null,step:0,answers:[],score:null,unable:false,route:null,opioid:false,sed:null},x||{});}

/* ===== navigation ===== */
function render(top){$app.innerHTML=header()+`<main class="wrap">${(V[S.screen]||V.home)()}</main>`;if(top)window.scrollTo(0,0);}
function go(s){S.stack.push(S.screen);S.screen=s;render(true);}
function goHome(){S.stack=[];S.screen='home';S.d=null;S.bed='';render(true);}
function back(){
  const d=S.d;
  if(d&&d.tool&&TOOLS[d.tool].obs){
    if(S.screen==='result'){d.step=items(d).length-1;d.answers.length=d.step;}
    else if(S.screen==='score'){
      if(d.step>0){d.step--;d.answers.length=d.step;return render(true);}
      if(TOOLS[d.tool].intub&&d.intubated!==null){d.intubated=null;return render(true);}
    }
  }
  S.screen=S.stack.pop()||'home'; if(S.screen==='home')return goHome(); render(true);
}
const TITLE={home:'ประเมินความปวด',who:'เลือกเครื่องมือ',score:'ให้คะแนน',result:'ผลและการจัดการ',drug:'ยาที่ให้',sed:'ก่อนให้ strong opioid',done:'บันทึกแล้ว',patient:'ผู้ป่วย',safety:'ติดตามหลังให้ opioid'};
function header(){
  let sub='รพ.ลำดวน';
  if(S.d){sub=`เตียง ${esc(S.d.bed||'-')}${S.d.tool&&S.screen!=='who'?'  |  '+tName(S.d)+' ('+S.d.who+')':''}`;}
  else if(S.pid&&getP(S.pid)&&S.screen!=='home'){const p=getP(S.pid);sub=`เตียง ${esc(p.bed)}${p.setting?'  |  '+setLabel(p.setting):''}`;}
  const home=S.screen==='home';
  return `<header class="top"><div class="bar">
    ${home?'':'<button class="ib" data-a="back" aria-label="ย้อนกลับ">‹</button>'}
    <div class="tt"><div class="t1">${TITLE[S.screen]||''}</div><div class="t2">${sub}</div></div>
    <button class="guide" data-a="guide">คู่มือเลือกเครื่องมือ</button>
    ${home?'':'<button class="ib" data-a="home" aria-label="หน้าหลัก">⌂</button>'}
  </div></header>`;
}

function card(p){
  const l=lastScored(p),t=openTasks(p)[0],r=t?dueText(t.due):null;
  return `<button class="pcard" data-a="open" data-v="${p.id}"><div class="bedno">${esc(p.bed)}</div>
  <div><div class="b">${l?short(l):'-'}</div><div class="muted sm">${t?(t.type==='safety'?'วัด V/S + sedation':'ประเมินซ้ำ'):'ไม่มีงานค้าง'}</div></div>
  ${t?`<div class="due ${r.c}" data-due="${t.due}">${r.txt}</div>`:'<div></div>'}</button>`;
}
function warn(sed,rr){
  const low=rr!==''&&rr!=null&&+rr<=10;
  if(sed==='3'||low)return '<div class="banner bad">อาจกดการหายใจ: กระตุ้นผู้ป่วย เปิดทางเดินหายใจ ให้ออกซิเจน รายงานแพทย์ทันที เตรียมอุปกรณ์ใส่ท่อและ naloxone ตาม protocol</div>';
  if(sed==='2')return '<div class="banner warn">Sedation 2: เปิดทางเดินหายใจ (นอนตะแคงถ้าไม่มีข้อห้าม) ให้ออกซิเจน แจ้งแพทย์ งดให้ strong opioid</div>';
  return '';
}
function interv(e){
  switch(e.act){
    case 'drug':return `ให้ยาแก้ปวด${e.opioid?' (strong opioid)':''} ทาง ${e.route}${e.opioid?`, sedation ก่อนให้ = ${e.sed}`:''}`;
    case 'nondrug':return 'บรรเทาปวดโดยไม่ใช้ยา';
    case 'md':return 'แจ้งแพทย์';
    case 'hold':return `งดให้ strong opioid เนื่องจาก sedation = ${e.sed}, แจ้งแพทย์`;
    default:return 'ไม่ต้องดำเนินการเพิ่ม';
  }
}
function aie(p){
  const L=[`เตียง/HN ${p.bed}${p.setting?' | '+setLabel(p.setting):''}`];
  p.entries.forEach(e=>{const t=fmt(e.t);
    if(e.kind==='safety'){L.push(`${t} ติดตามความปลอดภัย: sedation = ${e.sed}${e.rr?`, RR = ${e.rr}/นาที`:''}`);return;}
    L.push(`${t} ${e.kind==='initial'?'A':'E'}: ${e.unable?'ประเมินไม่ได้':`${e.toolName} (${e.who}) = ${e.score}/${e.max}`}`);
    L.push(`${t} I: ${interv(e)}`);});
  return L.join('\n');
}
function tasks(d,act,now){
  const T=[],m=CONFIG.reassessMin;
  if(act==='drug'){T.push({type:'reassess',due:now+m[d.route]*60000});if(d.opioid)T.push({type:'safety',due:now+CONFIG.safetyMin[d.route]*60000});}
  else if(act==='nondrug')T.push({type:'reassess',due:now+m.NONDRUG*60000});
  else if(act==='md'||act==='hold')T.push({type:'reassess',due:now+m.MD*60000});
  return T;
}
function save(act){
  const d=S.d,now=Date.now();let p=d.pid?getP(d.pid):null;
  if(!p){p={id:uid(),bed:d.bed||('ผู้ป่วย '+(DB.patients.length+1)),setting:d.setting,entries:[],tasks:[],lastTool:null,lastWho:'',intubated:null};DB.patients.push(p);}
  p.entries.push({t:now,kind:d.kind,unable:d.unable,toolName:d.unable?null:tName(d),who:d.who,score:d.score,max:d.unable?null:TOOLS[d.tool].max,
    act,route:d.route,opioid:d.opioid,sed:d.sed});
  if(!d.unable){p.lastTool=d.tool;p.lastWho=d.who;p.intubated=d.intubated;}
  p.tasks.forEach(t=>{if(!t.done&&t.type==='reassess')t.done=true;});
  tasks(d,act,now).forEach(t=>p.tasks.push(Object.assign({id:uid(),done:false},t)));
  persist();S.pid=p.id;S.d=null;S.bed='';S.stack=[];S.screen='done';render(true);
}

<tr><th>เครื่องมือ</th><th>ใช้กับ</th><th>คะแนน</th><th>แปลผล / เกณฑ์</th></tr>
<tr><td>NRS</td><td>ผู้ใหญ่ เด็กมากกว่า 6 ปี เข้าใจตัวเลข</td><td>0–10</td><td>0 ไม่ปวด, 1–3 น้อย, 4–6 ปานกลาง, 7–9 มาก, 10 มากที่สุด</td></tr>
<tr><td>Faces scale</td><td>เด็ก 3 ปีขึ้นไป ผู้ที่ไม่เข้าใจตัวเลข</td><td>0–10 (ทีละ 2)</td><td>ผู้ป่วยชี้หน้าเอง</td></tr>
<tr><td>CPOT</td><td>ผู้ใหญ่วิกฤต บอกเองไม่ได้</td><td>0–8 (4 หมวด × 0–2)</td><td>มากกว่า 2 บ่งชี้ว่าปวด</td></tr>
<tr><td>BPS / BPS-NI</td><td>ผู้ใหญ่วิกฤต ใส่ท่อ / ไม่ใส่ท่อ</td><td>3–12 (3 หมวด × 1–4)</td><td>3 = ไม่ปวด, มากกว่า 5 บ่งชี้ว่าปวด (เอกสาร รพ. ระบุ 7 ขึ้นไปต้อง intervention)</td></tr>
<tr><td>FLACC</td><td>เด็กเล็กที่บอกเองไม่ได้</td><td>0–10 (5 หมวด × 0–2)</td><td>ใช้ร่วมกับข้อมูลจากผู้ดูแล</td></tr>
<tr><td>PAINAD</td><td>สมองเสื่อมระยะรุนแรง</td><td>0–10 (5 หมวด × 0–2)</td><td>เทียบกับพฤติกรรมปกติของผู้ป่วย</td></tr>
</table></div><p class="sm muted">เกณฑ์แจ้งเตือนในแอปตั้งตามหน่วยงาน ต้องรับรองก่อนใช้จริง</p></div></details>

<details><summary>NRS และสเกลรูปใบหน้า</summary><div class="in">
<h3>NRS (Numeric Rating Scale)</h3><p>ถามว่า “ถ้า 0 คือไม่ปวดเลย 10 คือปวดมากที่สุดที่นึกออก ตอนนี้ปวดเท่าไร” ผู้ป่วยตอบด้วยการพูด ชี้ หรือเขียนก็ได้</p>
<h3>สเกลรูปใบหน้า (Faces)</h3><p>6 หน้า คะแนน 0, 2, 4, 6, 8, 10 ให้ผู้ป่วยเลือกหน้าที่ตรงกับความรู้สึกของตัวเอง พยาบาลไม่ได้เอาหน้าผู้ป่วยไปเทียบกับรูป</p><p class="sm muted">รูปในแอปเป็นสเกลใบหน้าที่หน่วยงานใช้ ไม่ใช่บัตร Wong-Baker FACES ฉบับต้นฉบับ (ซึ่งใช้หลักการเดียวกัน)</p>
<h3>สอนผู้ป่วยใช้เครื่องมือ 6 ขั้น</h3><ol><li>แสดงเครื่องมือและบอกวัตถุประสงค์</li><li>อธิบายส่วนประกอบ</li><li>อธิบายความหมายของความปวด</li><li>ทดสอบความเข้าใจ</li><li>ให้ทดลองบอกระดับปวด</li><li>ตั้งเป้าหมายการจัดการปวดร่วมกัน</li></ol>
</div></details>

<details><summary>CPOT และ BPS (ผู้ป่วยวิกฤต)</summary><div class="in">
<h3>CPOT</h3><p>4 หมวด หมวดละ 0–2 รวม 0–8: สีหน้า, การเคลื่อนไหวร่างกาย, ความตึงกล้ามเนื้อ (ขณะงอ–เหยียดแขนให้), การยอมรับเครื่องช่วยหายใจ หรือการออกเสียงถ้าไม่ใส่ท่อ</p>
<p>ประเมินทั้งขณะพักและขณะทำหัตถการที่ทำให้ปวด เช่น พลิกตัว ดูดเสมหะ</p>
<h3>BPS</h3><p>3 หมวด หมวดละ 1–4 รวม 3–12: สีหน้า, การเคลื่อนไหวแขน, การยอมรับเครื่องช่วยหายใจ ผู้ไม่ใส่ท่อใช้ BPS-NI ซึ่งเปลี่ยนหมวดสุดท้ายเป็นการออกเสียง</p>
<p class="sm muted">ชีพจรและความดันใช้ประกอบเท่านั้น ไม่ใช้แทนคะแนนปวด</p>
</div></details>

<details><summary>FLACC และ PAINAD</summary><div class="in">
<h3>FLACC (เด็ก)</h3><p>Face ใบหน้า, Legs ขา, Activity การเคลื่อนไหว, Cry การร้อง, Consolability การปลอบ หมวดละ 0–2 รวม 0–10</p>
<h3>PAINAD (สมองเสื่อม)</h3><p>การหายใจ, การออกเสียงเชิงลบ, สีหน้า, ภาษากาย, การปลอบ หมวดละ 0–2 รวม 0–10 ดูเทียบกับพฤติกรรมปกติของผู้ป่วยรายนั้น</p>
</div></details>

<details><summary>Sedation score และการเฝ้าระวัง opioid</summary><div class="in">
<p><b>0</b> ตื่นดี, <b>1</b> ง่วงเล็กน้อย ปลุกตื่นง่าย, <b>2</b> ง่วงซึม หลับเกือบตลอด ปลุกแล้วตื่น, <b>3</b> หลับตลอด ปลุกไม่ตื่นหรือตื่นยาก, <b>S</b> นอนหลับปกติ</p>
<p>ประเมิน sedation ก่อนและหลังให้ strong opioid ทุกครั้ง <b>ให้ได้เมื่อ 0–1 เท่านั้น</b></p>
<h3>วัด V/S หลังให้ strong opioid</h3><ul><li>IV หลังให้ 15 นาที</li><li>IM หลังให้ 30 นาที</li><li>รับประทาน หลังให้ 1 ชั่วโมง</li></ul>
<h3>เมื่อพบความผิดปกติ (ตามเอกสาร รพ.)</h3>
<p><b>Sedation 2 + RR มากกว่า 10:</b> เปิดทางเดินหายใจ นอนตะแคงถ้าไม่มีข้อห้าม ให้ออกซิเจน แจ้งแพทย์</p>
<p><b>Sedation 3 หรือ RR 10 หรือน้อยกว่า:</b> กระตุ้นให้หายใจ เปิดทางเดินหายใจ ให้ออกซิเจน เตรียมอุปกรณ์ใส่ท่อ เตรียม naloxone ตาม protocol และรายงานแพทย์ทันที</p>
<p>ผลข้างเคียง opioid ที่ต้องเฝ้าระวัง: คลื่นไส้อาเจียน ท้องผูก ง่วงซึม กดการหายใจ ส่วน NSAIDs เฝ้าระวังไต ตับ ทางเดินอาหาร หัวใจ เลือดออกง่าย และการแพ้ยา</p>
</div></details>

<details><summary>การจัดการ ประเมินซ้ำ และบันทึก</summary><div class="in">
<p>ความปวดเป็น<b>สัญญาณชีพที่ 5</b> ประเมินเมื่อผู้ป่วยบอกปวด หลังทำหัตถการ และก่อน–หลังจัดการความปวดทุกครั้ง</p>
<p><b>ไม่ใช้ยา:</b> ให้ข้อมูลลดความกังวล ผ่อนคลาย/หายใจช้า ๆ เบี่ยงเบนความสนใจ จัดท่า นวด สัมผัส ประคบร้อน/เย็น</p>
<p><b>บันทึกแบบ A–I–E:</b> A ประเมิน (เครื่องมือ คะแนน อาการ) → I สิ่งที่ทำ (ยา วิธีไม่ใช้ยา sedation ก่อนให้) → E ผลหลังทำ (คะแนนใหม่ด้วยเครื่องมือเดิม ผลข้างเคียง)</p>
<p>ปวดซับซ้อนหรือควบคุมไม่ได้ ส่งต่อ Pain clinic</p>
</div></details>

function openGuide(){S.guide=true;$modal.innerHTML=guideHTML();document.body.classList.add('lock');const x=$modal.querySelector('.xbtn');if(x)x.focus();}
function closeGuide(){S.guide=false;$modal.innerHTML='';document.body.classList.remove('lock');}


let tt;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800);}

/* ===== actions ===== */
const H={
  back,home:goHome,guide:openGuide,closeGuide,
  setting(v){S.setting=S.setting===v?null:v;render();},
  start(){S.d=draft({bed:S.bed.trim(),setting:S.setting});go('who');},
  who(v){const d=S.d,w=WHO.find(x=>x.id===v);d.step=0;d.answers=[];d.intubated=null;d.score=null;
    if(v==='UNABLE'){d.unable=true;d.tool=null;d.who='';go('result');}else{d.unable=false;d.tool=v;d.who=w.who;go('score');}},
  pick(v){S.d.score=+v;go('result');},
  intub(v){S.d.intubated=v==='1';S.d.step=0;S.d.answers=[];render(true);},
  swap(){S.d.tool=S.d.tool==='CPOT'?'BPS':'CPOT';render();},
  item(v){const d=S.d;d.answers[d.step]=+v;d.step++;if(d.step>=items(d).length){d.score=d.answers.reduce((a,b)=>a+b,0);go('result');}else render(true);},
  change(){go('who');},
  toDrug(){go('drug');},
  drug(v){const[r,o]=v.split('|');S.d.route=r;S.d.opioid=o==='1';S.d.sed=null;if(S.d.opioid)go('sed');else save('drug');},
  sed(v){S.d.sed=v;if(v==='0'||v==='1')save('drug');else render();},
  save(v){save(v);},
  open(v){S.pid=v;S.arm=false;go('patient');},
  reassess(){const p=getP(S.pid);S.d=draft({pid:p.id,kind:'reassess',bed:p.bed,setting:p.setting});
    if(p.lastTool){S.d.tool=p.lastTool;S.d.who=p.lastWho;go('score');}else go('who');},
  safety(){S.sf={sed:null,rr:''};go('safety');},
  sed2(v){S.sf.sed=v;render();},
  saveSafety(){const p=getP(S.pid);if(!p||S.sf.sed==null)return;p.entries.push({t:Date.now(),kind:'safety',sed:S.sf.sed,rr:S.sf.rr});
    p.tasks.forEach(t=>{if(!t.done&&t.type==='safety')t.done=true;});persist();S.stack=[];S.screen='done';render(true);},
  copy(){const el=document.getElementById('aie');if(!el)return;const txt=el.textContent;
    const fb=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('เลือกข้อความแล้ว กดคัดลอกได้เลย');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกแล้ว'),fb);else fb();},
  remove(){if(!S.arm){S.arm=true;render();return;}DB.patients=DB.patients.filter(p=>p.id!==S.pid);persist();S.arm=false;goHome();}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.dataset.self&&e.target!==b)return;   // backdrop closes only when tapped directly
  const f=H[b.dataset.a];if(f)f(b.dataset.v);
});
document.addEventListener('input',e=>{const k=e.target.dataset.in;
  if(k==='bed')S.bed=e.target.value;
  if(k==='rr'&&S.sf){S.sf.rr=e.target.value.replace(/\D/g,'');e.target.value=S.sf.rr;const w=document.getElementById('sfw');if(w)w.innerHTML=warn(S.sf.sed,S.sf.rr);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.guide)closeGuide();if(e.key==='Enter'&&e.target.dataset.in==='bed')H.start();});
setInterval(()=>document.querySelectorAll('[data-due]').forEach(el=>{const r=dueText(+el.dataset.due);el.textContent=r.txt;el.className='due '+r.c;}),20000);
render(true);
</script>
