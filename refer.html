<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบส่งต่อผู้ป่วย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column. Home lists diseases by organ system; each
   form is a stack of sections; output is a plain editable text area. */
:root {
  --bg: #EEF3F0;
  --surface: #F8FBF9;
  --ink: #1D3634;
  --muted: #56706C;
  --line: #CBDBD5;
  --field: #FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B1A;
    --surface: #162725;
    --ink: #E2EEEA;
    --muted: #9DB5B0;
    --line: #2A3F3C;
    --field: #0F1B1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1B1A;
  --surface: #162725;
  --ink: #E2EEEA;
  --muted: #9DB5B0;
  --line: #2A3F3C;
  --field: #0F1B1A;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc, #2E6B66); outline-offset: 2px; }

.shell { max-width: 640px; margin: 0 auto; min-width: 0; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 26px 22px;
  min-width: 0;
}
.title { font-family: "Prompt", "Sarabun", sans-serif; font-size: 20px; font-weight: 600; text-align: center; text-wrap: balance; }
.sub { font-size: 14px; color: var(--muted); text-align: center; margin-top: 4px; }

.group { margin-top: 22px; }
.group-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.group-title { font-size: 13px; font-weight: 600; color: var(--muted); }
.group-count { margin-left: auto; font-size: 12px; color: var(--muted); }

.dis-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--field);
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  text-align: left;
  min-width: 0;
  transition: border-color 140ms ease;
}
.dis-btn:hover { border-color: var(--acc); }
.dis-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); flex-shrink: 0; }
.dis-name { flex: 1; min-width: 0; }
.dis-en { font-size: 12px; color: var(--muted); white-space: nowrap; }

.header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; min-width: 0; }
.header-title { font-family: "Prompt", "Sarabun", sans-serif; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; text-wrap: balance; }
.back {
  border: none;
  background: var(--line);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 18px;
  flex-shrink: 0;
}
.badge {
  font-size: 12px;
  font-weight: 600;
  color: var(--acc);
  border: 1px solid var(--acc);
  border-radius: 999px;
  padding: 2px 10px;
  white-space: nowrap;
}

.section {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 14px;
  margin-top: 12px;
  min-width: 0;
}
.section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--ink); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.label { font-size: 13px; font-weight: 500; color: var(--muted); }
.input, .select, .textarea {
  width: 100%;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--field);
  font-size: 15px;
  outline: none;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--acc); }
.input::placeholder { color: var(--muted); opacity: 0.7; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line);
  background: var(--field);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  text-align: left;
  transition: border-color 140ms ease, background 140ms ease;
}
.chip.on {
  border-color: var(--acc);
  color: var(--acc);
  background: color-mix(in srgb, var(--acc) 12%, var(--field));
  font-weight: 600;
}

.score {
  display: inline-block;
  margin-top: 10px;
  font-size: 13px;
  color: var(--acc);
  background: color-mix(in srgb, var(--acc) 10%, var(--field));
  border-radius: 8px;
  padding: 5px 10px;
  line-height: 1.5;
}

.img-row { display: flex; flex-wrap: wrap; gap: 10px; }
.thumb { position: relative; width: 82px; height: 82px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-x {
  position: absolute; top: 3px; right: 3px;
  width: 22px; height: 22px; border-radius: 50%;
  border: none; background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 11px;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.img-add {
  width: 82px; height: 82px; border-radius: 10px;
  border: 1.5px dashed var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--muted); text-align: center; cursor: pointer;
}
.out-imgs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.out-imgs img { width: 130px; height: 130px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.out-imglabel { font-size: 13px; color: var(--muted); margin-top: 14px; font-weight: 600; }

.primary {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: var(--acc, #2E6B66);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
}
.secondary {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
}
.link {
  display: block;
  margin: 14px auto 0;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.copy {
  padding: 8px 14px;
  border: none;
  border-radius: 10px;
  background: #2E6B66;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}
.mono {
  width: 100%;
  min-height: 320px;
  padding: 14px;
  font-family: "IBM Plex Mono", "Sarabun", monospace;
  font-size: 13px;
  line-height: 1.7;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--field);
  resize: vertical;
}
.hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
.center { text-align: center; }
.phs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.ph {
  border: 1px dashed var(--line);
  background: var(--field);
  color: var(--acc, #2E6B66);
  border-radius: 8px;
  padding: 3px 8px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
}
.notice {
  font-size: 13px;
  color: var(--muted);
  border-left: 2px solid var(--acc, #2E6B66);
  padding: 8px 12px;
  margin-top: 12px;
  line-height: 1.6;
}
.foot {
  margin-top: 22px;
  font-size: 12.5px;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script type="text/babel" data-presets="react">

// ET tube block: แสดงเฉพาะเมื่อเลือกเบอร์หรือความลึก

  lungmass: "lung",
  hbv: "liver", hcc: "liver",
  nephro: "kidney",

// ---------- built-in diseases ----------

              "refer อายุรกรรมโรคปอด / ศัลยกรรมทรวงอก เพื่อประเมินและทำ tissue diagnosis",
              "refer เพื่อทำ CT chest with contrast (ถ้ายังไม่ได้ทำ)",
              "ปรึกษาเพื่อพิจารณา bronchoscopy / biopsy",
              "ปรึกษา multidisciplinary team (MDT) มะเร็งปอด",
              "แนะนำงดบุหรี่",
            ],
            def: ["refer อายุรกรรมโรคปอด / ศัลยกรรมทรวงอก เพื่อประเมินและทำ tissue diagnosis"],
          },
        ],
      },
    ],
    derive: (v) => {
      const smoke = v.smoking === "ไม่สูบ"
        ? "ปฏิเสธการสูบบุหรี่"
        : `${v.smoking}${v.packyear && String(v.packyear).trim() ? ` ${String(v.packyear).trim()} pack-year` : ""}`;
      const hasStage = v.t && v.n && v.m && ![v.t, v.n, v.m].some((x) => x.endsWith("x"));
      const stageLine = hasStage ? `\nclinical staging : c${v.t} ${v.n} ${v.m}` : "";
      const massDesc = [
        v.size && String(v.size).trim() ? `${String(v.size).trim()} cm` : "",
        v.location ? `at ${v.location}` : "",
      ].filter(Boolean).join(" ");
      return {
        smoking_txt: smoke,
        mass_line: `${v.imaging_type || "imaging"} : lung mass ${massDesc || "(ระบุขนาด/ตำแหน่ง)"}`,
        stage_line: stageLine,
      };
    },
    template: `ผู้ป่วย{sex} อายุ {age} ปี มีอาการ{symptoms} มา {duration}
ประวัติสูบบุหรี่ : {smoking_txt}

physical examination
Vital sign BP {bp} mmHg, HR {hr}, O2 sat {o2sat}%
{pe}

investigation :
{mass_line}{stage_line}

diagnosis : lung mass, r/o carcinoma of lung

management :
{management}{note_line}`,
  },
];

// ---------- generic derive: chips → ข้อความตามรูปแบบ join ----------
function genericChipDerive(disease, v) {
  const out = {};
  disease.sections.forEach((s) =>
    s.fields.forEach((f) => {
      if (f.type === "chips") {
        const arr = v[f.key] || [];
        out[f.key] =
          f.join === "bullet" ? bullets(arr) : arr.join(f.join === "comma" ? ", " : " ");
      } else if (f.type === "image") {
        const n = (v[f.key] || []).length;
        out[f.key] = n ? `แนบภาพ${f.label || ""} ${n} ภาพ` : "";
      }
    })
  );
  out.note_line = v.note && String(v.note).trim() ? `\n\nnote : ${String(v.note).trim()}` : "";
  return out;
}

// ---------- template fill (deterministic) ----------
function fillTemplate(disease, template, values) {
  const map = {
    ...values,
    ...genericChipDerive(disease, values),
    ...(disease.derive ? disease.derive(values) : {}),
  };
  const text = template.replace(/\{(\w+)\}/g, (_, key) => {
    const val = map[key];
    if (val === undefined || val === null) return ".......";
    const str = Array.isArray(val) ? val.join(" ") : String(val);
    if (key.endsWith("_line") || key.endsWith("_block")) return str;
    return orDots(str);
  });
  return text.replace(/\n{3,}/g, "\n\n").trim();
}

function collectPlaceholders(disease) {
  const keys = [];
  disease.sections.forEach((s) => s.fields.forEach((f) => keys.push(f.key)));
  if (disease.derive) {
    try {
      Object.keys(disease.derive({})).forEach((k) => !keys.includes(k) && keys.push(k));
    } catch (e) { /* derive อาจต้องการค่า — ข้ามได้ */ }
  }
  if (!keys.includes("note_line")) keys.push("note_line");
  return keys;
}

function defaultValues(disease) {
  const v = {};
  disease.sections.forEach((s) =>
    s.fields.forEach((f) => {
      if (f.type === "chips") v[f.key] = f.def ? [...f.def] : [];
      else if (f.type === "image") v[f.key] = [];
      else v[f.key] = f.def !== undefined ? f.def : "";
    })
  );
  v.note = "";
  return v;
}

// ---------- clipboard ----------
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

// ---------- field renderer ----------
function Field({ field, value, onChange }) {
  if (field.type === "select") {
    const opts = field.options.map((o) => (typeof o === "string" ? { label: o, value: o } : o));
    return (
      <div className={`field ${field.half ? "" : "full"}`}>
        <label className="label">{field.label}</label>
        <select className="select" value={value || ""} onChange={(e) => onChange(e.target.value)}>
          <option value="">— เลือก —</option>
          {opts.map((o) => (
            <option key={o.value} value={o.value}>{o.label}</option>
          ))}
        </select>
      </div>
    );
  }
  if (field.type === "chips") {
    const sel = value || [];
    const toggle = (opt) => onChange(sel.includes(opt) ? sel.filter((x) => x !== opt) : [...sel, opt]);
    return (
      <div className="field full">
        <label className="label">{field.label}</label>
        <div className="chips">
          {field.options.map((opt) => (
            <button key={opt} type="button" aria-pressed={sel.includes(opt)} className={`chip ${sel.includes(opt) ? "on" : ""}`} onClick={() => toggle(opt)}>
              {opt}
            </button>
          ))}
        </div>
      </div>
    );
  }
  if (field.type === "image") {
    const imgs = value || [];
    const onFiles = async (e) => {
      const files = Array.from(e.target.files || []);
      const read = (f) =>
        new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res({ name: f.name, data: r.result });
          r.readAsDataURL(f);
        });
      const loaded = await Promise.all(files.map(read));
      onChange([...imgs, ...loaded]);
      e.target.value = "";
    };
    const removeImg = (i) => onChange(imgs.filter((_, idx) => idx !== i));
    return (
      <div className="field full">
        <label className="label">{field.label}</label>
        <div className="img-row">
          {imgs.map((im, i) => (
            <div className="thumb" key={i}>
              <img src={im.data} alt={im.name} />
              <button type="button" className="thumb-x" aria-label="ลบรูป" onClick={() => removeImg(i)}>✕</button>
            </div>
          ))}
          <label className="img-add">
            + แนบรูป
            <input type="file" accept="image/*" multiple style={{ display: "none" }} onChange={onFiles} />
          </label>
        </div>
      </div>
    );
  }
  return (
    <div className={`field ${field.half ? "" : "full"}`}>
      <label className="label">{field.label}</label>
      <input className="input" value={value || ""} placeholder={field.ph || ""} inputMode={field.inputMode} onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function ReferralDocApp() {
  const [view, setView] = useState("home"); // home | form | output | template
  const [diseaseId, setDiseaseId] = useState(null);
  const [allValues, setAllValues] = useState({});
  const [templates, setTemplates] = useState(() => Object.fromEntries(BUILT_IN.map((d) => [d.id, d.template])));
  const [output, setOutput] = useState("");
  const [copied, setCopied] = useState(false);
  const tplRef = useRef(null);

  const disease = BUILT_IN.find((d) => d.id === diseaseId);
  const values = (disease && allValues[disease.id]) || {};

  const openForm = (d) => {
    setDiseaseId(d.id);
    setAllValues((prev) => ({ ...prev, [d.id]: prev[d.id] || defaultValues(d) }));
    setView("form");
  };

  const setValue = (key, val) =>
    setAllValues((prev) => ({ ...prev, [disease.id]: { ...prev[disease.id], [key]: val } }));

  const generate = () => {
    setOutput(fillTemplate(disease, templates[disease.id], values));
    setCopied(false);
    setView("output");
  };

  const doCopy = async () => {
    if (await copyText(output)) {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    }
  };

  const insertPlaceholder = (ph) => {
    const ta = tplRef.current;
    if (!ta) return;
    const token = `{${ph}}`;
    const start = ta.selectionStart ?? ta.value.length;
    const end = ta.selectionEnd ?? ta.value.length;
    const next = ta.value.slice(0, start) + token + ta.value.slice(end);
    setTemplates((prev) => ({ ...prev, [disease.id]: next }));
    requestAnimationFrame(() => {
      ta.focus();
      ta.selectionStart = ta.selectionEnd = start + token.length;
    });
  };

  const accStyle = disease ? { "--acc": disease.color } : {};

  return (
    <div className="shell" style={accStyle}>
      {view === "home" && (
        <div className="card">
          <div className="title">แบบส่งต่อผู้ป่วย</div>
          <div className="sub">เลือกโรคที่ต้องการสร้างเอกสาร</div>
          {GROUPS.map((g) => {
            const list = BUILT_IN.filter((d) => DISEASE_GROUP[d.id] === g.id);
            if (!list.length) return null;
            return (
              <div className="group" key={g.id}>
                <div className="group-head">
                  <span className="group-title">{g.name}</span>
                  <span className="group-count">{list.length} โรค</span>
                </div>
                {list.map((d) => (
                  <button key={d.id} className="dis-btn" style={{ "--acc": d.color }} onClick={() => openForm(d)}>
                    <span className="dis-dot" />
                    <span className="dis-name">{d.name}</span>
                    <span className="dis-en">{d.en}</span>
                  </button>
                ))}
              </div>
            );
          })}
          <div className="hint center" style={{ marginTop: 18 }}>
            เอกสารสร้างจากแม่แบบข้อความที่กำหนดไว้ ข้อมูลอยู่ในหน้านี้เท่านั้น ปิดหน้าแล้วจะหายไป
          </div>
        </div>
      )}

      {view === "form" && disease && (
        <div className="card">
          <div className="header">
            <button className="back" aria-label="กลับ" onClick={() => setView("home")}>‹</button>
            <div className="header-title">ข้อมูลผู้ป่วย: {disease.name}</div>
            <span className="badge">{disease.en}</span>
          </div>

          {disease.sections.map((sec, i) => (
            <div key={i} className="section">
              <div className="section-title">{sec.title}</div>
              <div className="grid">
                {sec.fields.map((f) => (
                  <Field key={f.key} field={f} value={values[f.key]} onChange={(val) => setValue(f.key, val)} />
                ))}
              </div>
              {disease.liveScore && sec.title.startsWith(disease.liveScore.afterTitle) && (
                <div className="score">{disease.liveScore.text(values, disease)}</div>
              )}
            </div>
          ))}

          <div className="section">
            <div className="field full">
              <label className="label">หมายเหตุเพิ่มเติม (เว้นว่างได้ — ต่อท้ายเอกสาร)</label>
              <input className="input" value={values.note || ""} onChange={(e) => setValue("note", e.target.value)} />
            </div>
          </div>

          <button className="primary" onClick={generate}>สร้างเอกสารอัตโนมัติ</button>
          <button className="link" onClick={() => setView("template")}>แก้ไขแม่แบบของโรคนี้</button>
        </div>
      )}

      {view === "output" && disease && (
        <div className="card">
          <div className="header">
            <button className="back" aria-label="กลับ" onClick={() => setView("form")}>‹</button>
            <div className="header-title">เอกสารส่งต่อผู้ป่วย</div>
            <button className="copy" onClick={doCopy}>{copied ? "คัดลอกแล้ว" : "คัดลอก"}</button>
          </div>
          <textarea className="mono" value={output} onChange={(e) => setOutput(e.target.value)} spellCheck={false} />
          <div className="hint">แก้ไขข้อความได้โดยตรงก่อนคัดลอก การแก้ไขมีผลเฉพาะเคสนี้</div>
          {(() => {
            const imgFields = [];
            disease.sections.forEach((s) => s.fields.forEach((f) => {
              if (f.type === "image" && (values[f.key] || []).length)
                imgFields.push({ label: f.label, imgs: values[f.key] });
            }));
            if (!imgFields.length) return null;
            return imgFields.map((g, gi) => (
              <div key={gi}>
                <div className="out-imglabel">{g.label} (แนบกับเอกสาร — คัดลอกเฉพาะข้อความ)</div>
                <div className="out-imgs">
                  {g.imgs.map((im, i) => <img key={i} src={im.data} alt={im.name} />)}
                </div>
              </div>
            ));
          })()}
          <button className="secondary" onClick={() => setView("form")}>กลับไปแก้ข้อมูล</button>
          <button className="secondary" onClick={() => { setAllValues((p) => ({ ...p, [disease.id]: defaultValues(disease) })); setView("form"); }}>
            สร้างเอกสารใหม่ (ล้างข้อมูล)
          </button>
        </div>
      )}

      {view === "template" && disease && (
        <div className="card">
          <div className="header">
            <button className="back" aria-label="กลับ" onClick={() => setView("form")}>‹</button>
            <div className="header-title">แม่แบบ: {disease.name}</div>
          </div>
          <div className="hint" style={{ marginTop: 0, marginBottom: 10 }}>
            พิมพ์ข้อความได้อิสระ ระบบจะแทนที่ {"{ชื่อช่อง}"} ด้วยข้อมูลที่กรอก กดชื่อด้านล่างเพื่อแทรกตรงตำแหน่งเคอร์เซอร์
          </div>
          <div className="phs">
            {collectPlaceholders(disease).map((p) => (
              <button key={p} type="button" className="ph" onClick={() => insertPlaceholder(p)}>
                {"{" + p + "}"}
              </button>
            ))}
          </div>
          <textarea ref={tplRef} className="mono" style={{ minHeight: 300 }} value={templates[disease.id]}
            onChange={(e) => setTemplates((prev) => ({ ...prev, [disease.id]: e.target.value }))} spellCheck={false} />
          <button className="primary" onClick={() => setView("form")}>บันทึกและไปกรอกข้อมูล</button>
          <button className="link" onClick={() => setTemplates((prev) => ({ ...prev, [disease.id]: disease.template }))}>
            คืนค่าแม่แบบเริ่มต้น
          </button>
        </div>
      )}

      <p className="foot">
        ไม่ต้องใส่ชื่อ-นามสกุลหรือเลข HN ของผู้ป่วยในหน้านี้ เอกสารที่คัดลอกไปใช้ต้องตรวจสอบกับเวชระเบียนและดุลยพินิจของแพทย์ก่อนส่งต่อ
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ReferralDocApp />);
</script>

</body>
